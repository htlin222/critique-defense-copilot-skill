name: Build & Release Skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from SHA
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Package skill
        run: |
          cd critique-defense-copilot
          zip -r ../critique-defense-copilot.zip .
          cd ..
          cp critique-defense-copilot.zip critique-defense-copilot.skill

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: critique-defense-copilot-${{ steps.version.outputs.sha }}
          path: critique-defense-copilot.skill

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v0.1.0-${SHORT_SHA}"
          cat > release-notes.md <<EOF
          ## critique-defense-copilot skill

          **Version:** \`${SHORT_SHA}\`
          **Commit:** ${GITHUB_SHA}

          ### Install

          \`\`\`bash
          npx skills add htlin222/critique-defense-copilot-skill
          \`\`\`

          Or download the \`.skill\` file from assets below.
          EOF
          gh release create "${TAG}" \
            --title "critique-defense-copilot skill ${TAG}" \
            --notes-file release-notes.md \
            critique-defense-copilot.skill
